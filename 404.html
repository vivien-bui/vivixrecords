<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>vivix records</title>
<script>
  // GitHub Pages doesn't support client-side routes, so redirect unknown
  // paths back to index.html with the path encoded in the query string.
  // index.html restores the real URL via history.replaceState on load.
  var pathSegmentsToKeep = 1; // keep "/vivixrecords"
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body>
</body>
</html>
